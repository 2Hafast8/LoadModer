name: Release Desktop Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Windows Executables
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type checking (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Compile application bundles
        run: npm run build:all

      - name: Run test suite
        run: npm test

      - name: Build standalone executables (NSIS Setup & Portable)
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA-256 Checksums
        shell: pwsh
        run: |
          Get-FileHash release/*.exe -Algorithm SHA256 | Format-Table -AutoSize | Out-File -FilePath release/SHA256SUMS.txt -Encoding utf8
          Get-Content release/SHA256SUMS.txt

      - name: Extract Release Notes from CHANGELOG.md
        run: node scripts/extract-release-notes.js
        env:
          REF_NAME: ${{ github.ref_name }}

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: LoadModer ${{ github.ref_name }}
          body_path: release/RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*.exe
            release/latest.yml
            release/SHA256SUMS.txt

