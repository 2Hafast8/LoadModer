name: Release Desktop Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Windows Executables
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type checking (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Compile application bundles
        run: npm run build:all

      - name: Run test suite
        run: npm test

      - name: Build standalone executables (NSIS Setup & Portable)
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA-256 Checksums
        shell: pwsh
        run: |
          Get-FileHash release/*.exe -Algorithm SHA256 | Format-Table -AutoSize | Out-File -FilePath release/SHA256SUMS.txt -Encoding utf8
          Get-Content release/SHA256SUMS.txt

      - name: Extract Release Notes from CHANGELOG.md
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          node -e "
            const fs = require('fs');
            const tag = process.env.REF_NAME || '';
            const version = tag.replace(/^v/, '');
            const content = fs.readFileSync('CHANGELOG.md', 'utf8');
            const escapedVer = version.replace(/\./g, '\\.');
            const regex = new RegExp('## \\[' + escapedVer + '\\] - \\d{4}-\\d{2}-\\d{2}\\r?\\n([\\s\\S]*?)(?=\\r?\\n---|\\r?\\n## \\[|$)');
            const match = content.match(regex);
            const notes = match ? match[1].trim() : 'Release ' + tag;
            const table = '\n\n---\n\n### 📥 Download Binaries (Windows)\n\n| File | Type | Description |\n| :--- | :---: | :--- |\n| **\`LoadModer-Setup-' + version + '.exe\`** | NSIS Installer | Standard Windows setup wizard with desktop shortcut & uninstaller |\n| **\`LoadModer-' + version + '-Portable.exe\`** | Portable App | Standalone executable without installation (run directly) |\n| **\`SHA256SUMS.txt\`** | Checksum | SHA-256 integrity verification file |\n';
            const body = '# 📦 LoadModer ' + tag + '\n\n' + notes + table;
            fs.mkdirSync('release', { recursive: true });
            fs.writeFileSync('release/RELEASE_NOTES.md', body, 'utf8');
          "

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: LoadModer ${{ github.ref_name }}
          body_path: release/RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*.exe
            release/latest.yml
            release/SHA256SUMS.txt

